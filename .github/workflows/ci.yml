name: CI

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install lint tools
        run: |
          brew install mint actionlint
          mint bootstrap
      - name: Lint
        run: make lint

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Mint and xcbeautify
        run: |
          git clone --depth 1 --branch 0.18.0 https://github.com/yonaskolb/Mint.git "$RUNNER_TEMP/Mint"
          swift build --package-path "$RUNNER_TEMP/Mint" -c release
          mint_bin="$(swift build --package-path "$RUNNER_TEMP/Mint" -c release --show-bin-path)"
          echo "$mint_bin" >> "$GITHUB_PATH"
          "$mint_bin/mint" install cpisciotta/xcbeautify
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Release build
        run: swift build -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Release tests
        run: swift test -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q

  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      matrix:
        include:
          - destination: platform=macOS
          - destination: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest
            simulator_name: iPhone 17 Pro
            runtime_prefix: iOS
          - destination: platform=visionOS Simulator,name=Apple Vision Pro,OS=latest
            simulator_name: Apple Vision Pro
            runtime_prefix: xrOS
    steps:
      - uses: actions/checkout@v4
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify Xcode 26.6 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.6' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          swift --version | grep -F 'Swift version 6.3'
      - name: Create simulator if needed
        if: matrix.simulator_name != ''
        run: |
          device_name='${{ matrix.simulator_name }}'
          runtime_prefix='com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime_prefix }}-'
          device_type=$(xcrun simctl list devicetypes -j | jq -er --arg name "$device_name" '.devicetypes[] | select(.name == $name) | .identifier')
          runtime=$(xcrun simctl list runtimes available -j | jq -er --arg prefix "$runtime_prefix" '[.runtimes[] | select(.identifier | startswith($prefix))] | sort_by(.version) | last | .identifier')

          if ! xcrun simctl list devices available -j | jq -e --arg runtime "$runtime" --arg name "$device_name" '(.devices[$runtime] // []) | any(.name == $name)' > /dev/null; then
            xcrun simctl create "$device_name" "$device_type" "$runtime"
          fi
      - name: Build for ${{ matrix.destination }}
        run: xcodebuild build -scheme Pathways -destination '${{ matrix.destination }}' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test on ${{ matrix.destination }}
        run: xcodebuild test -scheme Pathways -destination '${{ matrix.destination }}' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
