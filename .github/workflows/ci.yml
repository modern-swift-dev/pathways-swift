name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift-version: ["6.0", "6.3"]
    container: swift:${{ matrix.swift-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Swift ${{ matrix.swift-version }}
        run: swift --version | grep -F "Swift version ${{ matrix.swift-version }}"
      - name: Release build
        run: swift build -c release
      - name: Release tests
        run: swift test -c release

  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      matrix:
        include:
          - destination: platform=macOS
          - destination: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest
            simulator_name: iPhone 17 Pro
            runtime_prefix: iOS
          - destination: platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=latest
            simulator_name: Apple TV 4K (3rd generation)
            runtime_prefix: tvOS
          - destination: platform=visionOS Simulator,name=Apple Vision Pro,OS=latest
            simulator_name: Apple Vision Pro
            runtime_prefix: xrOS
          - destination: platform=watchOS Simulator,name=Apple Watch Series 11 (46mm),OS=latest
            simulator_name: Apple Watch Series 11 (46mm)
            runtime_prefix: watchOS
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 26.6 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.6'
          swift --version | grep -F 'Swift version 6.3'
      - name: Create simulator if needed
        if: matrix.simulator_name != ''
        run: |
          device_name='${{ matrix.simulator_name }}'
          runtime_prefix='com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime_prefix }}-'
          device_type=$(xcrun simctl list devicetypes -j | jq -er --arg name "$device_name" '.devicetypes[] | select(.name == $name) | .identifier')
          runtime=$(xcrun simctl list runtimes available -j | jq -er --arg prefix "$runtime_prefix" '[.runtimes[] | select(.identifier | startswith($prefix))] | sort_by(.version) | last | .identifier')

          if ! xcrun simctl list devices available -j | jq -e --arg runtime "$runtime" --arg name "$device_name" '(.devices[$runtime] // []) | any(.name == $name)' > /dev/null; then
            xcrun simctl create "$device_name" "$device_type" "$runtime"
          fi
      - name: Test on ${{ matrix.destination }}
        run: xcodebuild test -scheme Pathways -destination '${{ matrix.destination }}'
